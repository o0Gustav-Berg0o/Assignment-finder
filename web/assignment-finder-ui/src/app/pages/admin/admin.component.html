<div class="page">
  <div class="page-header">
    <h1>Users</h1>
  </div>

  <table *ngIf="users().length">
    <thead>
      <tr>
        <th>Email</th>
        <th>Status</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let u of users()">
        <td>{{ u.email }}</td>
        <td>
          <span class="badge" [class.badge-success]="u.isApproved" [class.badge-neutral]="!u.isApproved">
            {{ u.isApproved ? 'Approved' : 'Pending' }}
          </span>
        </td>
        <td>
          <button *ngIf="!u.isApproved" (click)="approve(u)">Approve</button>
          <button *ngIf="!u.isApproved" (click)="reject(u)">Reject</button>
        </td>
      </tr>
    </tbody>
  </table>
  <p class="subtle" *ngIf="!users().length">No users yet.</p>
</div>

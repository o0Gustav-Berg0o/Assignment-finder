<div class="page">
  <div class="page-header">
    <h1>Assignments</h1>
    <span class="subtle">{{ totalCount() }} total</span>
  </div>

  <form (ngSubmit)="onFilterChange()" class="filters">
    <label>
      Search
      <input type="text" placeholder="Title, description, skills" [(ngModel)]="query" name="query" />
    </label>
    <label>
      Area
      <input type="text" placeholder="e.g. Stockholm" [(ngModel)]="area" name="area" />
    </label>
    <label>
      <input type="checkbox" [(ngModel)]="onlyInteresting" name="onlyInteresting" (change)="onFilterChange()" />
      Interesting only
    </label>
    <button type="submit">Filter</button>
  </form>

  <table *ngIf="assignments().length">
    <thead>
      <tr>
        <th>Title</th>
        <th>Broker</th>
        <th>Area</th>
        <th>First seen</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let a of assignments()">
        <td><a [href]="a.url" target="_blank" rel="noopener">{{ a.title }}</a></td>
        <td>{{ a.brokerName }}</td>
        <td>{{ a.area }}</td>
        <td>{{ a.firstSeenAt | date: 'short' }}</td>
        <td>
          <button (click)="toggleInteresting(a)">
            {{ a.isInteresting ? '★ Interesting' : '☆ Mark interesting' }}
          </button>
        </td>
      </tr>
    </tbody>
  </table>
  <p class="subtle" *ngIf="!assignments().length">No assignments found.</p>

  <app-pagination [page]="page()" [pageSize]="pageSize" [totalCount]="totalCount()" (pageChange)="goToPage($event)" />
</div>

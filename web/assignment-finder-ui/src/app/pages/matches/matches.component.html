<div class="page">
  <div class="page-header">
    <h1>Matches</h1>
    <span class="subtle">{{ totalCount() }} total</span>
  </div>

  <form (ngSubmit)="onFilterChange()" class="filters">
    <label>
      Search
      <input type="text" placeholder="Title, description, skills" [(ngModel)]="query" name="query" />
    </label>
    <label>
      Area
      <input type="text" placeholder="e.g. Stockholm" [(ngModel)]="area" name="area" />
    </label>
    <label>
      <input type="checkbox" [(ngModel)]="unseenOnly" name="unseenOnly" (change)="onFilterChange()" />
      Unseen only
    </label>
    <button type="submit">Filter</button>
  </form>

  <table *ngIf="matches().length">
    <thead>
      <tr>
        <th>Title</th>
        <th>Broker</th>
        <th>Area</th>
        <th>Skills</th>
        <th>Matched at</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let m of matches()" [class.seen]="m.isSeen">
        <td><a [href]="m.url" target="_blank" rel="noopener">{{ m.title }}</a></td>
        <td>{{ m.brokerName }}</td>
        <td>{{ m.area }}</td>
        <td>{{ m.skills }}</td>
        <td>{{ m.matchedAt | date: 'short' }}</td>
        <td>
          <button *ngIf="!m.isSeen" (click)="markSeen(m)">Mark seen</button>
        </td>
      </tr>
    </tbody>
  </table>
  <p class="subtle" *ngIf="!matches().length">No matches yet.</p>

  <app-pagination [page]="page()" [pageSize]="pageSize" [totalCount]="totalCount()" (pageChange)="goToPage($event)" />
</div>

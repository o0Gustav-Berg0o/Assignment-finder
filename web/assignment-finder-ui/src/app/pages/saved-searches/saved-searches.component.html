<div class="page">
  <div class="page-header">
    <h1>Saved searches</h1>
  </div>

  <table *ngIf="savedSearches().length">
    <thead>
      <tr>
        <th>Name</th>
        <th>Area keywords</th>
        <th>Requirement keywords</th>
        <th>Min matches</th>
        <th>Active</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let s of savedSearches()">
        <td>{{ s.name }}</td>
        <td>{{ s.areaKeywords }}</td>
        <td>{{ s.requirementKeywords }}</td>
        <td>{{ s.minRequirementMatches }}</td>
        <td>
          <input type="checkbox" [checked]="s.isActive" (change)="toggleActive(s)" />
        </td>
        <td><button (click)="remove(s)">Delete</button></td>
      </tr>
    </tbody>
  </table>
  <p class="subtle" *ngIf="!savedSearches().length">No saved searches yet - add one below.</p>

  <h2>Add saved search</h2>
  <form (ngSubmit)="add()" class="card">
    <label>
      Name
      <input name="name" [(ngModel)]="newName" required />
    </label>
    <label>
      Area keywords (comma-separated, e.g. Stockholm,Remote)
      <input name="area" [(ngModel)]="newArea" />
    </label>
    <label>
      Requirement keywords (comma-separated, e.g. C#,Azure)
      <input name="requirements" [(ngModel)]="newRequirements" />
    </label>
    <label>
      Minimum requirement matches
      <input type="number" min="0" name="minMatches" [(ngModel)]="newMinMatches" />
    </label>
    <button type="submit">Add</button>
  </form>
</div>

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/AssignmentFinder.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Server=db;Database=AssignmentFinder;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Admin__Email: ${ADMIN_EMAIL}
      Admin__Password: ${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5080:8080"

  worker:
    build:
      context: .
      dockerfile: src/AssignmentFinder.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Default: Server=db;Database=AssignmentFinder;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;
      Scan__CronSchedule: ${SCAN_CRON_SCHEDULE:-0 0 */3 * * ?}
      Email__Host: ${SMTP_HOST}
      Email__Port: ${SMTP_PORT:-587}
      Email__FromAddress: ${SMTP_FROM}
      Email__Username: ${SMTP_USERNAME}
      Email__Password: ${SMTP_PASSWORD}
      Email__UseSsl: ${SMTP_USE_SSL:-true}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: web/assignment-finder-ui
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "4310:80"

volumes:
  db-data:

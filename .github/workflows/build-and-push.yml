name: Build and push images

# Builds the api/worker/web images and pushes them to GitHub Container Registry (ghcr.io),
# free to use and readable by Azure Container Apps without a separate registry.
# Manual trigger is included so an image can be rebuilt/pushed on demand before a deploy.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: api
            context: .
            dockerfile: src/AssignmentFinder.Api/Dockerfile
          - image: worker
            context: .
            dockerfile: src/AssignmentFinder.Worker/Dockerfile
          - image: web
            context: web/assignment-finder-ui
            dockerfile: web/assignment-finder-ui/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/assignment-finder-${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/assignment-finder-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
